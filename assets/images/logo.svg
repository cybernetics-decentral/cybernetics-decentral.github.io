<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Cyan glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Linear Gradients -->
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0055ff" />
    </linearGradient>
  </defs>

  <g transform="translate(100, 100)">
    <!-- Outer thin hexagon grid -->
    <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45" fill="none" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1"/>
    
    <!-- Outer thick glowing hexagon -->
    <polygon points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40" fill="none" stroke="url(#cyan-grad)" stroke-width="4" filter="url(#glow)"/>
    
    <!-- Inner structural lines -->
    <line x1="-69" y1="-40" x2="69" y2="40" stroke="rgba(0, 240, 255, 0.3)" stroke-width="2" />
    <line x1="69" y1="-40" x2="-69" y2="40" stroke="rgba(0, 240, 255, 0.3)" stroke-width="2" />
    <line x1="0" y1="-80" x2="0" y2="80" stroke="rgba(0, 240, 255, 0.3)" stroke-width="2" />
    
    <!-- Middle rotating hexagon (visually) -->
    <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25" fill="none" stroke="#fff" stroke-width="2" filter="url(#glow)"/>
    
    <!-- Inner core node -->
    <circle cx="0" cy="0" r="12" fill="#00f0ff" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="4" fill="#fff"/>
    
    <!-- Perimeter nodes -->
    <circle cx="0" cy="-80" r="5" fill="#fff" filter="url(#glow)"/>
    <circle cx="69" cy="-40" r="5" fill="#fff" filter="url(#glow)"/>
    <circle cx="69" cy="40" r="5" fill="#fff" filter="url(#glow)"/>
    <circle cx="0" cy="80" r="5" fill="#fff" filter="url(#glow)"/>
    <circle cx="-69" cy="40" r="5" fill="#fff" filter="url(#glow)"/>
    <circle cx="-69" cy="-40" r="5" fill="#fff" filter="url(#glow)"/>
  </g>
</svg>
